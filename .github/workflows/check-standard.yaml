# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Routine runs (push/PR) skip building and checking vignettes: one of them,
# vignettes/uncertainty.qmd, takes 4-6 minutes of R/Julia execution on its
# own, and the others are not free either -- see dev/vignette-runtime.md. Run
# this workflow manually with "Build vignettes" checked for a pre-release
# full check that includes them.
on:
  push:
    branches: [main, master, rstantools, juliaFit]
  pull_request:
    branches: [main, master, rstantools, juliaFit]
  workflow_dispatch:
    inputs:
      vignettes:
        description: 'Build and check vignettes (full pre-release check)'
        type: boolean
        default: false
name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2
          
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check
      
      - name: executable Permissions
        run: |
          chmod +x configure
      - uses: r-lib/actions/setup-tinytex@v2
        env: 
          TINYTEX_INSTALLER: TinyTeX
          
      - name: Install additional LaTeX packages
        run: |
          tlmgr install biblatex-apa biblatex babel-english csquotes preprint mathtools caption biber
          
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ (github.event_name == 'workflow_dispatch' && inputs.vignettes == true) && 'c("--no-manual", "--as-cran")' || 'c("--no-manual", "--as-cran", "--no-vignettes")' }}
          build_args: ${{ (github.event_name == 'workflow_dispatch' && inputs.vignettes == true) && 'c("--no-manual", "--compact-vignettes=gs+qpdf")' || 'c("--no-manual", "--no-build-vignettes")' }}
          error-on: '"error"'
          upload-snapshots: true

  check-success:
    needs: R-CMD-check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const checkJobs = jobs.data.jobs.filter(job => job.name.includes('R-CMD-check') && job.name !== 'check-success');
            const successCount = checkJobs.filter(job => job.conclusion === 'success').length;
            console.log(`${successCount} of ${checkJobs.length} jobs succeeded`);
            if (successCount < 2) process.exit(1);
