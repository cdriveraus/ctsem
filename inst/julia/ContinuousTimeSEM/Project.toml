[extras]
# DataFrames is test-only: a DataFrame literal is still the clearest way to
# write a parameter table in a test, but the package itself takes plain columns.
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
# `Statistics` is a standard library but still has to be declared to be
# `using`-able: `test_sampler.jl` checks the sampler against the moments of
# posteriors known in closed form, and means and covariances are the whole
# assertion. It passed in a scratch environment that happened to have it and
# errored under `Pkg.test()`, which is the environment that counts.
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["DataFrames", "Statistics", "Test"]
