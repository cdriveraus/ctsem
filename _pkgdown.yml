# ctsem's website. Build it with dev/build-site.R, never pkgdown::build_site()
# on this tree: the vignettes fit models with the Julia engine, so they ship
# pre-rendered (vignettes/<name>.html), and the script turns those pages into
# articles without running anything. pkgdown on the tree would render the .qmd
# sources, Julia fits and all.
url: https://cdriveraus.github.io/ctsem/

template:
  bootstrap: 5

development:
  mode: release

home:
  links:
  - text: Questions and discussion
    href: https://github.com/cdriveraus/ctsem/discussions
  - text: Tutorial preprint
    href: https://osf.io/preprints/psyarxiv/4q9ex_v3

navbar:
  structure:
    left: [intro, reference, articles, manual, new, news]
    right: [search, github]
  components:
    manual:
      text: Manual (pdf)
      href: articles/hierarchicalmanual.pdf
    new:
      text: New in 4.x
      href: NEW-IN-4.html

# README.md and NEW-IN-4.md link NEWS.md, which pkgdown turns into NEWS.html.
redirects:
- ["NEWS.html", "news/index.html"]

